<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pong</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #101522;
      color: #f4f7ff;
      font-family: system-ui, sans-serif;
    }

    main {
      width: min(92vw, 800px);
      text-align: center;
    }

    h1 { margin: 0 0 8px; }

    p {
      margin: 0 0 16px;
      color: #b7c1d8;
    }

    .scoreboard {
      display: flex;
      justify-content: center;
      gap: 48px;
      margin-bottom: 12px;
      font-size: 1.25rem;
      font-weight: 700;
    }

    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 800 / 450;
      border: 2px solid #53617d;
      border-radius: 8px;
      background: #080c14;
      cursor: none;
      touch-action: none;
    }

    button {
      margin-top: 14px;
      padding: 9px 18px;
      border: 0;
      border-radius: 6px;
      background: #6ea8fe;
      color: #101522;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: #91bcff; }
  </style>
</head>
<body>
  <main>
    <h1>Pong</h1>
    <p>Move your mouse over the game or use ↑ and ↓ to control the left paddle.</p>

    <div class="scoreboard" aria-live="polite">
      <span>You: <span id="player-score">0</span></span>
      <span>Computer: <span id="computer-score">0</span></span>
    </div>

    <canvas id="game" width="800" height="450" aria-label="Pong game"></canvas>
    <button id="restart" type="button">Restart game</button>
  </main>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const playerScoreEl = document.getElementById("player-score");
    const computerScoreEl = document.getElementById("computer-score");

    const WIDTH = canvas.width;
    const HEIGHT = canvas.height;
    const PADDLE_WIDTH = 12;
    const PADDLE_HEIGHT = 90;
    const BALL_SIZE = 12;
    const PLAYER_SPEED = 7;

    const player = { x: 24, y: (HEIGHT - PADDLE_HEIGHT) / 2 };
    const computer = { x: WIDTH - 24 - PADDLE_WIDTH, y: (HEIGHT - PADDLE_HEIGHT) / 2 };
    const ball = { x: WIDTH / 2, y: HEIGHT / 2, vx: 5, vy: 3 };

    let playerScore = 0;
    let computerScore = 0;
    let upPressed = false;
    let downPressed = false;
    let lastTime = 0;

    function clampPaddle(paddle) {
      paddle.y = Math.max(0, Math.min(HEIGHT - PADDLE_HEIGHT, paddle.y));
    }

    function resetBall(direction) {
      ball.x = WIDTH / 2 - BALL_SIZE / 2;
      ball.y = HEIGHT / 2 - BALL_SIZE / 2;
      ball.vx = 5 * direction;
      ball.vy = (Math.random() * 4 - 2) || 1.5;
    }

    function update(delta) {
      const frameScale = Math.min(delta / 16.67, 2);

      if (upPressed) player.y -= PLAYER_SPEED * frameScale;
      if (downPressed) player.y += PLAYER_SPEED * frameScale;
      clampPaddle(player);

      // The computer tracks the ball, but moves more slowly to keep the game playable.
      const computerCenter = computer.y + PADDLE_HEIGHT / 2;
      const target = ball.y + BALL_SIZE / 2;
      const aiSpeed = 4.2 * frameScale;
      if (computerCenter < target - 10) computer.y += aiSpeed;
      if (computerCenter > target + 10) computer.y -= aiSpeed;
      clampPaddle(computer);

      ball.x += ball.vx * frameScale;
      ball.y += ball.vy * frameScale;

      // Top and bottom wall collisions.
      if (ball.y <= 0) {
        ball.y = 0;
        ball.vy = Math.abs(ball.vy);
      } else if (ball.y + BALL_SIZE >= HEIGHT) {
        ball.y = HEIGHT - BALL_SIZE;
        ball.vy = -Math.abs(ball.vy);
      }

      // Paddle collisions, with the rebound angle based on where the ball hits.
      if (
        ball.vx < 0 &&
        ball.x <= player.x + PADDLE_WIDTH &&
        ball.x + BALL_SIZE >= player.x &&
        ball.y + BALL_SIZE >= player.y &&
        ball.y <= player.y + PADDLE_HEIGHT
      ) {
        ball.x = player.x + PADDLE_WIDTH;
        bounceFromPaddle(player, 1);
      }

      if (
        ball.vx > 0 &&
        ball.x + BALL_SIZE >= computer.x &&
        ball.x <= computer.x + PADDLE_WIDTH &&
        ball.y + BALL_SIZE >= computer.y &&
        ball.y <= computer.y + PADDLE_HEIGHT
      ) {
        ball.x = computer.x - BALL_SIZE;
        bounceFromPaddle(computer, -1);
      }

      // A point is scored when the ball passes either paddle.
      if (ball.x + BALL_SIZE < 0) {
        computerScore++;
        computerScoreEl.textContent = computerScore;
        resetBall(1);
      } else if (ball.x > WIDTH) {
        playerScore++;
        playerScoreEl.textContent = playerScore;
        resetBall(-1);
      }
    }

    function bounceFromPaddle(paddle, direction) {
      const paddleCenter = paddle.y + PADDLE_HEIGHT / 2;
      const hitOffset = (ball.y + BALL_SIZE / 2 - paddleCenter) / (PADDLE_HEIGHT / 2);
      const speed = Math.min(Math.hypot(ball.vx, ball.vy) + 0.25, 10);
      const angle = hitOffset * (Math.PI / 3);

      ball.vx = direction * speed * Math.cos(angle);
      ball.vy = speed * Math.sin(angle);
    }

    function draw() {
      ctx.clearRect(0, 0, WIDTH, HEIGHT);

      // Dashed center line.
      ctx.strokeStyle = "#34405a";
      ctx.setLineDash([10, 12]);
      ctx.beginPath();
      ctx.moveTo(WIDTH / 2, 0);
      ctx.lineTo(WIDTH / 2, HEIGHT);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = "#f4f7ff";
      ctx.fillRect(player.x, player.y, PADDLE_WIDTH, PADDLE_HEIGHT);
      ctx.fillRect(computer.x, computer.y, PADDLE_WIDTH, PADDLE_HEIGHT);
      ctx.fillRect(ball.x, ball.y, BALL_SIZE, BALL_SIZE);
    }

    function frame(timestamp) {
      const delta = lastTime ? timestamp - lastTime : 16.67;
      lastTime = timestamp;
      update(delta);
      draw();
      requestAnimationFrame(frame);
    }

    function movePlayerToPointer(event) {
      const bounds = canvas.getBoundingClientRect();
      const scaleY = HEIGHT / bounds.height;
      player.y = (event.clientY - bounds.top) * scaleY - PADDLE_HEIGHT / 2;
      clampPaddle(player);
    }

    canvas.addEventListener("pointermove", movePlayerToPointer);

    window.addEventListener("keydown", (event) => {
      if (event.key === "ArrowUp" || event.key === "ArrowDown") {
        event.preventDefault();
      }
      if (event.key === "ArrowUp") upPressed = true;
      if (event.key === "ArrowDown") downPressed = true;
    });

    window.addEventListener("keyup", (event) => {
      if (event.key === "ArrowUp") upPressed = false;
      if (event.key === "ArrowDown") downPressed = false;
    });

    window.addEventListener("blur", () => {
      upPressed = false;
      downPressed = false;
    });

    document.getElementById("restart").addEventListener("click", () => {
      playerScore = 0;
      computerScore = 0;
      playerScoreEl.textContent = "0";
      computerScoreEl.textContent = "0";
      player.y = (HEIGHT - PADDLE_HEIGHT) / 2;
      computer.y = (HEIGHT - PADDLE_HEIGHT) / 2;
      resetBall(Math.random() < 0.5 ? -1 : 1);
    });

    requestAnimationFrame(frame);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Hand Motion Tracking - Samsung Browser Ready</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }
    header {
      width: 100%;
      padding: 12px 16px;
      background: #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }
    h1 { font-size: 16px; color: #38bdf8; }
    #score-badge {
      background: #0284c7;
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 14px;
    }
    .stage-container {
      position: relative;
      width: 100%;
      max-width: 640px;
      aspect-ratio: 3 / 4;
      background: #000;
      overflow: hidden;
      margin-top: 8px;
      border-radius: 12px;
    }
    /* Mirror the video and canvas for natural front-camera interaction */
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.88);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
      z-index: 10;
    }
    .btn {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 14px 28px;
      font-size: 17px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 16px;
    }
    .btn:disabled { background: #64748b; cursor: not-allowed; }
    #status {
      margin-top: 12px;
      font-size: 14px;
      color: #94a3b8;
      max-width: 320px;
    }
    .controls-bar {
      padding: 12px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .small-btn {
      background: #334155;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<header>
  <h1>✋ OT Hand Motion Tracker</h1>
  <div id="score-badge">Targets Hit: <span id="score">0</span></div>
</header>

<div class="stage-container">
  <!-- playsinline and muted are required for Samsung Internet & iOS Safari autoplay -->
  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="output_canvas"></canvas>

  <div id="overlay">
    <h2>Camera Hand Tracking</h2>
    <p style="margin-top:8px; color:#cbd5e1; font-size:14px;">
      Move your <strong>Index Finger</strong> in front of the camera to pop the glowing targets!
    </p>
    <button id="startBtn" class="btn" disabled>Loading AI Hand Model...</button>
    <div id="status">Initializing MediaPipe Vision Engine...</div>
  </div>
</div>

<div class="controls-bar">
  <button class="small-btn" onclick="switchCamera()">🔄 Flip Camera (Front/Rear)</button>
</div>

<!-- Load MediaPipe Tasks Vision via ES Module -->
<script type="module">
  import {
    HandLandmarker,
    FilesetResolver
  } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

  const video = document.getElementById("webcam");
  const canvas = document.getElementById("output_canvas");
  const ctx = canvas.getContext("2d");
  const startBtn = document.getElementById("startBtn");
  const statusText = document.getElementById("status");
  const overlay = document.getElementById("overlay");

  let handLandmarker = undefined;
  let running = false;
  let facingMode = "user"; // "user" = front selfie camera, "environment" = back camera
  let currentStream = null;
  let audioCtx = null;
  let score = 0;

  // Interactive Target State (Normalized coordinates 0.0 to 1.0)
  let target = { x: 0.5, y: 0.4, radius: 36 };

  // 1. Web Audio Synthesizer
  function playPopSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1046.5, audioCtx.currentTime + 0.12);
    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.25);
  }

  // 2. Initialize MediaPipe Hand Landmarker
  async function createHandLandmarker() {
    try {
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );
      handLandmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numHands: 2
      });
      startBtn.disabled = false;
      startBtn.innerText = "📷 Enable Camera & Start";
      statusText.innerText = "Ready! Tap above and allow camera permission.";
    } catch (err) {
      statusText.innerText = "Error loading AI model: " + err.message;
    }
  }
  createHandLandmarker();

  // 3. Open Camera (Samsung Browser & Mobile Optimized)
  async function startCamera() {
    if (currentStream) {
      currentStream.getTracks().forEach(track => track.stop());
    }

    // Check HTTPS requirement
    if (location.protocol !== "https:" && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
      statusText.innerHTML = "⚠️ <b>HTTPS Required:</b> Samsung Browser blocks cameras on local files. Please host this file on GitHub Pages, CodePen, or Liveweave.";
      return;
    }

    try {
      const constraints = {
        audio: false,
        video: {
          facingMode: facingMode,
          width: { ideal: 640 },
          height: { ideal: 480 }
        }
      };

      currentStream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = currentStream;

      // Mirror only when using front camera
      const mirrorScale = facingMode === "user" ? "scaleX(-1)" : "scaleX(1)";
      video.style.transform = mirrorScale;
      canvas.style.transform = mirrorScale;

      video.onloadedmetadata = () => {
        video.play();
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        overlay.style.display = "none";
        if (!running) {
          running = true;
          predictWebcam();
        }
      };
    } catch (err) {
      statusText.innerText = "Camera access denied or unavailable: " + err.message;
    }
  }

  startBtn.addEventListener("click", () => {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    startCamera();
  });

  window.switchCamera = () => {
    facingMode = facingMode === "user" ? "environment" : "user";
    if (running) startCamera();
  };

  // Hand skeleton connections (fixed complete tuples)
  const HAND_CONNECTIONS = [
    [0, 1], [1, 2], [2, 3], [3, 4],           // Thumb
    [0, 5], [5, 6], [6, 7], [7, 8],           // Index
    [5, 9], [9, 10], [10, 11], [11, 12],      // Middle
    [9, 13], [13, 14], [14, 15], [15, 16],    // Ring
    [13, 17], [0, 17], [17, 18], [18, 19], [19, 20] // Pinky & Palm
  ];

  // 4. Real-Time Detection Loop
  let lastVideoTime = -1;
  async function predictWebcam() {
    if (video.currentTime !== lastVideoTime && video.readyState >= 2) {
      lastVideoTime = video.currentTime;
      const results = handLandmarker.detectForVideo(video, performance.now());

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw Target Circle
      const tx = target.x * canvas.width;
      const ty = target.y * canvas.height;
      ctx.beginPath();
      ctx.arc(tx, ty, target.radius, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(250, 204, 21, 0.85)";
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = "#ffffff";
      ctx.stroke();

      // Draw Tracked Hands
      if (results.landmarks) {
        for (const landmarks of results.landmarks) {
          // Draw skeleton lines
          ctx.strokeStyle = "#38bdf8";
          ctx.lineWidth = 3;
          for (const [startIdx, endIdx] of HAND_CONNECTIONS) {
            const p1 = landmarks[startIdx];
            const p2 = landmarks[endIdx];
            ctx.beginPath();
            ctx.moveTo(p1.x * canvas.width, p1.y * canvas.height);
            ctx.lineTo(p2.x * canvas.width, p2.y * canvas.height);
            ctx.stroke();
          }

          // Draw 21 joint dots
          for (let i = 0; i < landmarks.length; i++) {
            const lm = landmarks[i];
            const lx = lm.x * canvas.width;
            const ly = lm.y * canvas.height;

            ctx.beginPath();
            ctx.arc(lx, ly, i === 8 ? 10 : 5, 0, Math.PI * 2);
            ctx.fillStyle = i === 8 ? "#f43f5e" : "#22c55e"; // Highlight Index Tip (#8) in red
            ctx.fill();
          }

          // Check collision between Index Finger Tip (Landmark #8) and Target
          const indexTip = landmarks[8];
          const ix = indexTip.x * canvas.width;
          const iy = indexTip.y * canvas.height;
          const dist = Math.hypot(ix - tx, iy - ty);

          if (dist < target.radius + 15) {
            score++;
            document.getElementById("score").innerText = score;
            playPopSound();
            // Spawn new random target within comfortable reaching zone
            target.x = 0.15 + Math.random() * 0.7;
            target.y = 0.15 + Math.random() * 0.7;
          }
        }
      }
    }
    requestAnimationFrame(predictWebcam);
  }
</script>

</body>
</html>

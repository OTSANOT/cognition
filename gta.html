<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Two-Digit Calculation Practice</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: radial-gradient(circle at top, #28345a, #111827 65%); color: #fff;
      font-family: Inter, Arial, sans-serif; padding: 16px;
    }
    .game {
      width: min(430px, 100%); background: rgba(15,23,42,.94);
      border: 2px solid #38bdf8; border-radius: 24px; padding: 20px;
      box-shadow: 0 18px 50px rgba(0,0,0,.45);
    }
    h1 { margin: 0 0 16px; text-align: center; font-size: 24px; color: #67e8f9; }
    .stats { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
    .stat { flex: 1; text-align: center; background: #1e293b; border-radius: 12px; padding: 8px; }
    .stat strong { display: block; color: #fbbf24; font-size: 20px; }
    .problem {
      min-height: 96px; display: grid; place-items: center;
      background: #0f172a; border: 2px solid #334155; border-radius: 18px;
      font-size: clamp(38px, 12vw, 58px); font-weight: 800; letter-spacing: 2px;
    }
    #answer {
      width: 100%; margin: 14px 0 10px; text-align: center; font-size: 32px; font-weight: 800;
      color: #fff; background: #fff; color: #0f172a; border: 0; border-radius: 14px;
      padding: 10px; outline: 3px solid transparent;
    }
    #answer:focus { outline-color: #38bdf8; }
    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    button {
      border: 0; border-radius: 12px; min-height: 58px; font-size: 22px; font-weight: 800;
      color: #fff; background: #334155; cursor: pointer; box-shadow: 0 4px 0 #1e293b;
      touch-action: manipulation;
    }
    button:active { transform: translateY(2px); box-shadow: 0 2px 0 #1e293b; }
    .clear { background: #dc2626; box-shadow: 0 4px 0 #991b1b; }
    .submit { background: #059669; box-shadow: 0 4px 0 #047857; }
    #feedback { min-height: 28px; text-align: center; font-weight: 800; margin-top: 10px; }
    .correct { color: #4ade80; } .wrong { color: #fb7185; }
  </style>
</head>
<body>
  <main class="game">
    <h1>Two-Digit Calculation</h1>
    <div class="stats">
      <div class="stat">Score<strong id="score">0</strong></div>
      <div class="stat">Streak<strong id="streak">0</strong></div>
      <div class="stat">Best<strong id="best">0</strong></div>
    </div>

    <div class="problem" id="problem" aria-live="polite">-- + --</div>
    <input id="answer" type="text" inputmode="numeric" pattern="-?[0-9]*" autocomplete="off" aria-label="Answer" placeholder="Answer">

    <div class="keypad" aria-label="Number keypad">
      <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button>
      <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button>
      <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button>
      <button class="clear" id="clear">C</button><button data-key="0">0</button><button class="submit" id="submit">OK</button>
    </div>
    <div id="feedback" aria-live="polite"></div>
  </main>

  <script>
    const problemEl = document.getElementById('problem');
    const answerEl = document.getElementById('answer');
    const feedbackEl = document.getElementById('feedback');
    const scoreEl = document.getElementById('score');
    const streakEl = document.getElementById('streak');
    const bestEl = document.getElementById('best');

    let score = 0;
    let streak = 0;
    let best = Number(localStorage.getItem('calculationBest') || 0);
    let a = 0;
    let b = 0;
    let operator = '+';
    let correctAnswer = 0;
    bestEl.textContent = best;

    function randomTwoDigit() {
      return Math.floor(Math.random() * 90) + 10;
    }

    function newProblem() {
      answerEl.value = '';
      feedbackEl.textContent = '';
      feedbackEl.className = '';

      const operators = ['+', '-', '×', '÷'];
      operator = operators[Math.floor(Math.random() * operators.length)];

      if (operator === '-') {
        a = randomTwoDigit();
        b = randomTwoDigit();
        if (b > a) [a, b] = [b, a];
        correctAnswer = a - b;
      } else if (operator === '×') {
        a = randomTwoDigit();
        b = randomTwoDigit();
        correctAnswer = a * b;
      } else if (operator === '÷') {
        b = randomTwoDigit();
        correctAnswer = randomTwoDigit();
        a = b * correctAnswer;
        if (a > 999) {
          b = Math.floor(Math.random() * 20) + 10;
          correctAnswer = Math.floor(Math.random() * 20) + 10;
          a = b * correctAnswer;
        }
      } else {
        a = randomTwoDigit();
        b = randomTwoDigit();
        correctAnswer = a + b;
      }

      problemEl.textContent = `${a} ${operator} ${b}`;
      answerEl.focus();
    }

    function submitAnswer() {
      if (answerEl.value.trim() === '') return;
      const submitted = Number(answerEl.value);

      if (submitted === correctAnswer) {
        score += 10;
        streak++;
        if (streak > best) {
          best = streak;
          localStorage.setItem('calculationBest', String(best));
        }
        scoreEl.textContent = score;
        streakEl.textContent = streak;
        bestEl.textContent = best;
        feedbackEl.textContent = 'Correct!';
        feedbackEl.className = 'correct';
        setTimeout(newProblem, 650);
      } else {
        streak = 0;
        streakEl.textContent = streak;
        feedbackEl.textContent = `Try again — ${a} ${operator} ${b} = ${correctAnswer}`;
        feedbackEl.className = 'wrong';
        answerEl.select();
      }
    }

    document.querySelectorAll('[data-key]').forEach(button => {
      button.addEventListener('click', () => {
        answerEl.value += button.dataset.key;
        answerEl.focus();
      });
    });

    document.getElementById('clear').addEventListener('click', () => {
      answerEl.value = '';
      answerEl.focus();
    });
    document.getElementById('submit').addEventListener('click', submitAnswer);
    answerEl.addEventListener('keydown', event => {
      if (event.key === 'Enter') submitAnswer();
    });

    newProblem();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alternating Trail Making Game</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #121826;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 16px;
      margin: 0;
    }

    h1 {
      margin: 0 0 14px;
      font-size: 26px;
    }

    .top-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      align-items: center;
      margin-bottom: 14px;
      font-size: 16px;
      background: #1e293b;
      padding: 10px 18px;
      border-radius: 10px;
      border: 1px solid #334155;
    }

    select, button {
      background: #0f172a;
      color: #ffffff;
      border: 1px solid #475569;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
    }

    button {
      background: #2563eb;
      border-color: #2563eb;
    }

    button:hover {
      background: #1d4ed8;
    }

    .hint {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 16px;
      text-align: center;
    }

    .board {
      display: grid;
      gap: 10px;
    }

    .board.grid-4 {
      grid-template-columns: repeat(4, 82px);
      grid-template-rows: repeat(4, 82px);
    }

    .board.grid-5 {
      grid-template-columns: repeat(5, 70px);
      grid-template-rows: repeat(5, 70px);
    }

    .cell {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }

    .cell:hover {
      border-color: #60a5fa;
    }

    .cell.done {
      background: #065f46;
      border-color: #10b981;
      color: #a7f3d0;
      cursor: default;
    }

    .cell.wrong {
      background: #7f1d1d;
      border-color: #ef4444;
    }

    #message {
      margin-top: 18px;
      font-size: 18px;
      color: #34d399;
      min-height: 24px;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>Alternating Trail Making</h1>

  <div class="top-bar">
    <label>
      Mode:
      <select id="modeSelect" onchange="resetTrail()">
        <option value="alt4" selected>Alternating 4x4 (1-A-2-B...)</option>
        <option value="alt5">Alternating 5x5 (1-A-2-B...)</option>
        <option value="num4">Numbers 4x4 (1 - 16)</option>
        <option value="num5">Numbers 5x5 (1 - 25)</option>
      </select>
    </label>
    <span>Next: <strong id="nextItem">1</strong></span>
    <span>Time: <strong id="timer">0.0</strong>s</span>
    <span>Best: <strong id="bestTime">--</strong></span>
    <button type="button" onclick="resetTrail()">New Board</button>
  </div>

  <div class="hint" id="modeHint">Alternate between Numbers and Letters: 1 &rarr; A &rarr; 2 &rarr; B &rarr; 3 &rarr; C...</div>

  <div class="board grid-4" id="board"></div>
  <div id="message"></div>

  <script>
    var LETTERS = ["A", "B", "C", "D", "E", "F", "G", "H", "I", "J", "K", "L", "M"];
    var sequence = [];
    var currentIndex = 0;
    var startTime = 0;
    var timerInterval = null;
    var bestTimes = { alt4: null, alt5: null, num4: null, num5: null };

    function stopClock() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function buildSequence(mode) {
      var list = [];
      var total = (mode === "alt4" || mode === "num4") ? 16 : 25;

      if (mode === "num4" || mode === "num5") {
        for (var n = 1; n <= total; n++) {
          list.push(String(n));
        }
      } else {
        var numCount = 1;
        var letCount = 0;
        for (var i = 0; i < total; i++) {
          if (i % 2 === 0) {
            list.push(String(numCount));
            numCount++;
          } else {
            list.push(LETTERS.slice(letCount, letCount + 1).pop());
            letCount++;
          }
        }
      }
      return list;
    }

    function updateBestDisplay(mode) {
      var best = bestTimes[mode];
      document.getElementById("bestTime").textContent = (best === null) ? "--" : best + "s";
    }

    function resetTrail() {
      stopClock();

      var mode = document.getElementById("modeSelect").value;
      var size = (mode === "alt4" || mode === "num4") ? 4 : 5;

      sequence = buildSequence(mode);
      currentIndex = 0;

      updateBestDisplay(mode);
      document.getElementById("nextItem").textContent = sequence.slice(0, 1).pop();
      document.getElementById("timer").textContent = "0.0";
      document.getElementById("message").textContent = "";

      document.getElementById("modeHint").innerHTML = (mode === "alt4" || mode === "alt5")
        ? "Alternate between Numbers and Letters: 1 &rarr; A &rarr; 2 &rarr; B &rarr; 3 &rarr; C..."
        : "Tap the numbers in order from 1 to " + (size * size) + ".";

      var board = document.getElementById("board");
      board.className = "board grid-" + size;
      board.innerHTML = "";

      var shuffled = sequence.slice().sort(function () {
        return 0.5 - Math.random();
      });

      for (var i = 0; i < shuffled.length; i++) {
        var val = shuffled.slice(i, i + 1).pop();
        var cell = document.createElement("div");
        cell.className = "cell";
        cell.setAttribute("data-val", val);
        cell.textContent = val;
        cell.onclick = tapCell;
        board.appendChild(cell);
      }
    }

    function tapCell() {
      var val = this.getAttribute("data-val");
      if (this.classList.contains("done")) return;

      var expected = sequence.slice(currentIndex, currentIndex + 1).pop();

      if (val !== expected) {
        var el = this;
        el.classList.add("wrong");
        setTimeout(function () {
          el.classList.remove("wrong");
        }, 250);
        return;
      }

      if (currentIndex === 0) {
        startTime = Date.now();
        timerInterval = setInterval(function () {
          var elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
          document.getElementById("timer").textContent = elapsed;
        }, 100);
      }

      this.classList.add("done");
      currentIndex++;

      if (currentIndex >= sequence.length) {
        stopClock();
        var finalSec = ((Date.now() - startTime) / 1000).toFixed(1);
        document.getElementById("timer").textContent = finalSec;
        document.getElementById("nextItem").textContent = "Done";

        var mode = document.getElementById("modeSelect").value;
        if (bestTimes[mode] === null || parseFloat(finalSec) < parseFloat(bestTimes[mode])) {
          bestTimes[mode] = finalSec;
        }
        updateBestDisplay(mode);

        document.getElementById("message").textContent =
          "Completed trail in " + finalSec + " seconds!";
      } else {
        document.getElementById("nextItem").textContent = sequence.slice(currentIndex, currentIndex + 1).pop();
      }
    }

    resetTrail();
  </script>
</body>
</html>
